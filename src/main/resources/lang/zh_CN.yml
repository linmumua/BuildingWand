# 建筑之杖 语言文件（MiniMessage）
#
# 配色按「角色」而非「好看」来分，全文件只有四个职责：
#   锚色  #8FE3A8 → #3E8E58  品牌绿，只出现在前缀与分区标题
#   强调  gold              载荷（玩家名、之杖名、数量、核心名）
#   中性  gray / white      正文与说明，说明一律 gray
#   警示  red / yellow      仅用于失败与警告，绝不做装饰
# 占位符在代码里以 <name> 形式替换

prefix: '<gradient:#8FE3A8:#3E8E58><bold>建筑之杖</bold></gradient> <dark_gray>»</dark_gray> '

# ---- 权限与状态 ----------------------------------------------------------
no-permission: '<red>你没有权限那么做'
player-only: '<red>该指令只能由玩家执行'
reload-done: '<green>配置与语言已重载'

# ---- 物品发放 ------------------------------------------------------------
give-other: '<white>已给予 </white><gold><player></gold><white> </white><gold><tier></gold>'
give-received: '<white>你收到了 </white><gold><tier></gold>'
unknown-tier: '<red>没有这个档位</red> <dark_gray>·</dark_gray> <gray>可选：石 / 铁 / 钻石</gray>'
player-not-found: '<red>找不到玩家</red> <gold><player></gold>'
ce-not-ready: '<red>前置尚未就绪</red> <dark_gray>·</dark_gray> <gray>CraftEngine 还没加载完，稍后再试</gray>'

# ---- 放置反馈 ------------------------------------------------------------
not-enough-blocks: '<yellow>方块不够</yellow> <dark_gray>·</dark_gray> <white>本次只放了 </white><gold><count></gold><white> 格</white>'

# ---- 撤销 ----------------------------------------------------------------
undo-success: '<green>已撤销</green> <dark_gray>·</dark_gray> <white>还原 </white><gold><count></gold><white> 格</white>'
undo-none: '<gray>没有可以撤销的操作</gray>'

# ---- 核心与限制 ----------------------------------------------------------
lock-switched: '<white>限制 </white><dark_gray>»</dark_gray> <gold><lock></gold>'

lock-HORIZONTAL: '水平'
lock-VERTICAL: '垂直'
lock-NORTHSOUTH: '南北'
lock-EASTWEST: '东西'
lock-NOLOCK: '无限制'

match-EXACT: '完全相同'
match-SIMILAR: '相似'
match-ANY: '任意'

state-on: '<green>开启'
state-off: '<gray>关闭'

direction-TARGET: '目标'
direction-PLAYER: '玩家'

# ---- 选项界面 ------------------------------------------------------------
# 标题只留品牌色，不加渐变：选项界面会反复打开，渐变在这里属于过度装饰
options-title: '<dark_gray>建筑之杖 <dark_gray>·</dark_gray> <gray>选项'

gui-tier: '<gray>当前之杖</gray> <dark_gray>·</dark_gray> <gold><value></gold>'
gui-lock: '<gray>放置限制</gray> <dark_gray>·</dark_gray> <gold><value></gold>'
gui-lock-lore: '<gray>点击切换扩展方向'
gui-direction: '<gray>放置朝向</gray> <dark_gray>·</dark_gray> <gold><value></gold>'
gui-direction-lore: '<gray>目标：朝向跟随被放置的支撑面<newline><gray>玩家：朝向跟随你自己'
gui-replace: '<gray>替换方块</gray> <dark_gray>·</dark_gray> <gold><value></gold>'
gui-replace-lore: '<gray>是否顶替水、雪、草丛这类可替换方块'
gui-match: '<gray>方块匹配</gray> <dark_gray>·</dark_gray> <gold><value></gold>'
gui-match-lore: '<gray>相同：只延伸同种方块<newline><gray>相似：同组方块视为同类<newline><gray>任意：只要不是空气'
gui-random: '<gray>随机模式</gray> <dark_gray>·</dark_gray> <gold><value></gold>'
gui-random-lore: '<gray>从快捷栏随机取方块'
gui-close: '<red>关闭'
gui-info: '<gray>一次最多铺 </gray><gold><limit></gold><gray> 格</gray>'

# ---- 指令帮助 ------------------------------------------------------------
# 指令统一 aqua（可点击/可执行的语义色），说明统一 gray，分隔符统一 dark_gray
help: '<aqua>/bw give [玩家] <等级></aqua> <dark_gray>»</dark_gray> <gray>发放之杖</gray><newline><aqua>/bw undo</aqua> <dark_gray>»</dark_gray> <gray>撤销上一次操作</gray><newline><aqua>/bw reload</aqua> <dark_gray>»</dark_gray> <gray>重载配置与语言</gray>'
